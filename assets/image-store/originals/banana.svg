<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#fff9c4"/>
    </radialGradient>

    <!-- Main banana body - bright yellow, lit from top -->
    <linearGradient id="bananaBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="25%" stop-color="#ffee58"/>
      <stop offset="60%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>

    <!-- Top highlight gloss -->
    <linearGradient id="bananaGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fffde7" stop-opacity="0"/>
    </linearGradient>

    <!-- Under-shadow of banana curve -->
    <linearGradient id="bananaShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f57f17" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Tip gradient -->
    <linearGradient id="tipG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#b8860b" flood-opacity="0.3"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="40"/>

  <!-- Ground shadow -->
  <ellipse cx="205" cy="365" rx="110" ry="14" fill="#c8a000" opacity="0.18"/>

  <!-- BANANA MAIN BODY - crescent arc shape -->
  <g filter="url(#shadow)">
    <!-- Main yellow body -->
    <path d="
      M 108,290
      C  80,240  70,170  95,118
      C 110, 88 138, 70 162, 68
      C 186, 66 205, 80 216, 98
      C 248,155 252,228 238,282
      C 228,318 210,335 192,338
      C 168,342 138,328 108,290 Z
    " fill="url(#bananaBody)"/>

    <!-- Dark underside shadow along the inner curve -->
    <path d="
      M 120,284
      C  96,234  88,168 110,118
      C 122, 92 144, 76 164, 74
      C 140, 90 118,118 108,160
      C  96,208  98,262 120,298 Z
    " fill="#f9a825" opacity="0.6"/>

    <!-- Top gloss highlight -->
    <path d="
      M 162, 76
      C 186, 74 208, 88 220,108
      C 236,136 244,176 242,216
      C 220,188 206,148 192,118
      C 180, 94 172, 80 162, 76 Z
    " fill="url(#bananaGloss)"/>

    <!-- Bright specular streak -->
    <path d="
      M 178, 82
      C 200, 90 218,112 228,140
      C 218,126 202,106 182, 96 Z
    " fill="white" opacity="0.55"/>
  </g>

  <!-- STEM - brown curved nub at top -->
  <path d="M 156,72 C 150,52 158,38 168,34 C 172,32 176,36 174,42 C 170,50 162,58 160,70 Z"
    fill="url(#tipG)"/>
  <!-- Stem gloss -->
  <path d="M 160,68 C 156,52 160,40 166,36 C 162,42 158,56 160,68 Z"
    fill="white" opacity="0.3"/>

  <!-- BOTTOM TIP - small brown point -->
  <path d="M 190,336 C 196,348 200,360 196,368 C 192,374 186,370 184,362 C 182,352 184,342 190,336 Z"
    fill="url(#tipG)"/>

  <!-- Edge ridge lines - subtle banana facet lines -->
  <path d="M 116,268 C 100,218 100,160 118,116" fill="none" stroke="#f9a825" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 228,268 C 242,220 242,160 222,114" fill="none" stroke="#fff176" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
