<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Chestnut face: warm brown lit top-left -->
    <radialGradient id="faceG" cx="35%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#e8a060"/>
      <stop offset="28%" stop-color="#b85c28"/>
      <stop offset="60%" stop-color="#7a2e10"/>
      <stop offset="100%" stop-color="#3a1008"/>
    </radialGradient>

    <!-- Neck: same but darker -->
    <radialGradient id="neckG" cx="30%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#c87840"/>
      <stop offset="40%" stop-color="#8a3818"/>
      <stop offset="80%" stop-color="#4a1808"/>
      <stop offset="100%" stop-color="#200a02"/>
    </radialGradient>

    <!-- White blaze patch -->
    <radialGradient id="blazeG" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0ebe2"/>
      <stop offset="100%" stop-color="#d0c8b8"/>
    </radialGradient>

    <!-- Mane back (darkest layer) -->
    <radialGradient id="maneDeepG" cx="15%" cy="10%" r="85%">
      <stop offset="0%" stop-color="#3a2018"/>
      <stop offset="50%" stop-color="#180c06"/>
      <stop offset="100%" stop-color="#060202"/>
    </radialGradient>

    <!-- Mane mid -->
    <radialGradient id="maneMidG" cx="22%" cy="15%" r="78%">
      <stop offset="0%" stop-color="#503020"/>
      <stop offset="45%" stop-color="#221008"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>

    <!-- Mane front (nearest, slight highlight) -->
    <radialGradient id="maneFrontG" cx="28%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#6a4030"/>
      <stop offset="40%" stop-color="#301808"/>
      <stop offset="100%" stop-color="#0e0604"/>
    </radialGradient>

    <!-- Ear -->
    <radialGradient id="earG" cx="55%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#d08048"/>
      <stop offset="100%" stop-color="#5a2010"/>
    </radialGradient>

    <filter id="drop">
      <feDropShadow dx="2" dy="5" stdDeviation="8" flood-color="#180804" flood-opacity="0.4"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- === MANE — drawn BEHIND head, fills right side === -->
  <!-- Deepest back layer, wide and dark -->
  <path d="M 228,52 C 260,72 290,110 308,158 C 328,210 330,272 318,338 C 314,362 308,384 300,400
           L 340,400 C 350,370 358,330 358,280 C 358,210 342,148 314,100 C 296,68 268,45 248,38 Z"
    fill="url(#maneDeepG)"/>

  <!-- Mid mane layer -->
  <path d="M 218,48 C 254,65 282,105 298,155 C 316,210 316,275 302,340 C 296,365 288,385 280,400
           L 310,400 C 320,372 328,338 330,295 C 334,235 322,170 298,120 C 278,78 252,52 230,42 Z"
    fill="url(#maneMidG)"/>

  <!-- Front mane layer, most visible -->
  <path d="M 208,46 C 242,62 268,100 282,150 C 298,205 296,272 280,336 C 274,360 265,382 256,400
           L 285,400 C 296,374 305,342 308,300 C 314,240 304,170 278,118 C 258,76 230,50 210,42 Z"
    fill="url(#maneFrontG)"/>

  <!-- Mane inner highlight (thin bright strip on front edge) -->
  <path d="M 210,50 C 232,68 252,102 264,148 C 256,118 240,80 210,50 Z"
    fill="#7a5038" opacity="0.55"/>

  <!-- === NECK / CHEST base === -->
  <path d="M 60,400 C 55,345 58,290 70,245 C 82,198 106,162 138,140
           C 165,120 200,112 228,118 C 255,124 274,142 278,166
           C 282,190 268,218 245,238 C 220,260 188,275 162,300
           C 136,326 108,360 88,400 Z"
    fill="url(#neckG)" filter="url(#drop)"/>

  <!-- === WHITE PAINT PATCH on neck === -->
  <path d="M 72,400 C 70,355 78,308 98,272 C 115,240 140,220 165,216
           C 182,213 196,220 200,236 C 205,254 195,278 178,295
           C 158,315 130,340 108,372 C 98,385 86,395 72,400 Z"
    fill="url(#blazeG)" opacity="0.88"/>
  <!-- Soft patch edge -->
  <path d="M 72,400 C 70,355 78,308 98,272 C 115,240 140,220 165,216
           C 182,213 196,220 200,236 C 205,254 195,278 178,295
           C 158,315 130,340 108,372 C 98,385 86,395 72,400 Z"
    fill="none" stroke="#e0d8c8" stroke-width="8" opacity="0.25" filter="url(#softBlur)"/>

  <!-- === HEAD === -->
  <!-- Head is a tapered shape: wide at top/back, narrowing to muzzle bottom-left -->
  <path d="M 118,318 C 88,295 68,265 62,232 C 55,196 62,162 82,138
           C 100,116 128,102 158,98 C 186,95 212,105 228,124
           C 244,144 246,170 236,194 C 225,220 204,238 180,250
           C 155,263 128,270 112,285 Z"
    fill="url(#faceG)" filter="url(#drop)"/>

  <!-- === WHITE BLAZE down face === -->
  <path d="M 185,100 C 193,115 196,138 190,162 C 183,188 170,210 158,230
           C 148,246 138,260 130,272 C 136,256 148,238 156,218
           C 166,194 172,166 170,140 C 168,118 174,104 185,100 Z"
    fill="url(#blazeG)" opacity="0.85"/>

  <!-- === EAR === -->
  <path d="M 202,102 C 210,80 224,65 234,68 C 244,71 246,88 238,106
           C 232,120 220,128 210,124 C 200,120 196,112 202,102 Z"
    fill="url(#earG)"/>
  <!-- Ear inner -->
  <path d="M 208,104 C 214,88 224,76 230,80 C 236,84 234,98 226,110
           C 220,120 212,124 208,118 C 204,112 204,108 208,104 Z"
    fill="#c06840" opacity="0.5"/>

  <!-- === FORELOCK — small curl at forehead === -->
  <path d="M 224,72 C 214,88 206,104 204,118 C 208,102 216,84 224,72 Z"
    fill="url(#maneFrontG)"/>
  <path d="M 216,68 C 204,86 196,104 196,120 C 200,103 210,82 216,68 Z"
    fill="url(#maneMidG)"/>
  <!-- Forelock curl -->
  <path d="M 198,80 C 186,90 180,104 184,116 C 180,104 182,88 198,80 Z"
    fill="url(#maneDeepG)"/>

  <!-- === MUZZLE darkening === -->
  <ellipse cx="84" cy="274" rx="26" ry="20" fill="#5a2010" opacity="0.3" filter="url(#softBlur)"/>

  <!-- Nostril -->
  <path d="M 72,278 C 74,270 82,267 87,273 C 90,278 88,285 82,286
           C 76,287 70,283 72,278 Z"
    fill="#2a0e06" opacity="0.85"/>

  <!-- === EYE === -->
  <ellipse cx="162" cy="185" rx="12" ry="13" fill="#160808"/>
  <!-- Eye shine -->
  <ellipse cx="157" cy="179" rx="4.5" ry="4" fill="white" opacity="0.92"/>
  <ellipse cx="167" cy="191" rx="2" ry="2" fill="white" opacity="0.4"/>
  <!-- Eyelid shadow -->
  <path d="M 150,179 C 156,171 170,171 174,179"
    fill="none" stroke="#3a1008" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
</svg>
